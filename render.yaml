services:
  # ---------------------------------------------------------------------------
  # 1. AssistFlow Backend API (Node.js Web Service)
  # ---------------------------------------------------------------------------
  - type: web
    name: assistflow-api
    runtime: node
    plan: starter
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm run start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        fromDatabase:
          name: assistflow-postgres
          property: connectionString
      - key: DATABASE_SSL
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: DEFAULT_USER_EMAIL
        sync: false
      - key: DEFAULT_USER_FIRST_NAME
        value: Ermias
      - key: DEFAULT_USER_LAST_NAME
        value: Teklemarkos
      - key: DEFAULT_USER_PASSWORD
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: N8N_WORKFLOW_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: FRONTEND_URL
        fromService:
          type: web
          name: assistflow-web
          envVarKey: RENDER_EXTERNAL_URL

  # ---------------------------------------------------------------------------
  # 2. AssistFlow Frontend Dashboard (Global CDN Static Site)
  # ---------------------------------------------------------------------------
  - type: web
    name: assistflow-web
    runtime: static
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: assistflow-api
          envVarKey: RENDER_EXTERNAL_URL

# -----------------------------------------------------------------------------
# 3. Managed PostgreSQL Database
# -----------------------------------------------------------------------------
databases:
  - name: assistflow-postgres
    plan: starter
    databaseName: assistflow_ai_pro_db
    user: assistflow_ai_pro_user
